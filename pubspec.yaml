name: community_flutter_stamp_composite
description: "Native JPEG composite for GPS stamp photos: decode to the output size, EXIF orientation, rotate, mirror, stamp overlay, JPEG with EXIF + GPS, and a map snapshot."
version: 1.2.0
homepage: https://github.com/EYALIN/community_flutter_stamp_composite
repository: https://github.com/EYALIN/community_flutter_stamp_composite
issue_tracker: https://github.com/EYALIN/community_flutter_stamp_composite/issues
funding:
  - https://github.com/sponsors/EYALIN
topics:
  - camera
  - jpeg
  - exif
  - gps
  - image

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.community.flutter.stampcomposite
        pluginClass: CommunityFlutterStampCompositePlugin
      ios:
        pluginClass: CommunityFlutterStampCompositePlugin
